<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Shield Badge (Safety / Budget) -->
  <path d="M256 80 L380 135 C380 260 256 360 256 385 C256 360 132 260 132 135 Z" 
        fill="url(#emeraldGrad)" opacity="0.18" />

  <!-- Shopping Trolley Cart -->
  <g transform="translate(116, 128)" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Trolley Handle & Frame -->
    <path d="M12 24 L52 24 L88 180 L236 180 L266 70 L64 70" />
    <!-- Basket Grid Lines -->
    <path d="M80 120 L248 120" stroke-width="14" stroke-opacity="0.75" />
    <path d="M128 70 L140 180" stroke-width="14" stroke-opacity="0.75" />
    <path d="M192 70 L198 180" stroke-width="14" stroke-opacity="0.75" />
    <!-- Wheels -->
    <circle cx="104" cy="226" r="18" fill="#10b981" stroke="#ffffff" stroke-width="14" />
    <circle cx="220" cy="226" r="18" fill="#10b981" stroke="#ffffff" stroke-width="14" />
  </g>

  <!-- Safety Shield with Checkmark Floating on top-right -->
  <g transform="translate(305, 95)" filter="url(#glow)">
    <path d="M70 15 L125 40 C125 105 70 145 70 155 C70 145 15 105 15 40 Z" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    <!-- Rupiah / Checkmark symbol inside shield -->
    <path d="M45 78 L62 95 L95 58" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Discount % Tag on bottom left -->
  <g transform="translate(75, 340)">
    <rect x="0" y="0" width="110" height="52" rx="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6" />
    <text x="55" y="34" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">% OFF</text>
  </g>
</svg>
